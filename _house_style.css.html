    <style>
        :root { --bg-primary:#121a1b; --bg-card:#172122; --bg-code:#1e292a; --text-primary:#ede5d9; --text-secondary:#8e9a96; --accent:#a896c7; --accent-dim:#a896c744; --accent-glow:#a896c733; --accent-2:#d78da4; --accent-3:#eea465; --accent-4:#6fbba9; --border:#293636; --font-display:'Barlow Semi Condensed',sans-serif; --font-mono:'Red Hat Mono','Red Hat Mono',monospace; --font-body:'Barlow',sans-serif; --max-width:900px; }
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        html{scroll-behavior:smooth}
        body{background:var(--bg-primary);color:var(--text-primary);font-family:var(--font-body);font-size:17px;line-height:1.7;overflow-x:hidden}
        .hero{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem 1.5rem;text-align:center;position:relative}
        .hero::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:700px;height:600px;background:radial-gradient(circle,var(--accent-glow) 0%,transparent 70%);pointer-events:none;z-index:0}
        .hero>*{position:relative;z-index:1}
        .series-label{font-family:var(--font-mono);font-size:.85rem;color:var(--accent);letter-spacing:.15em;text-transform:uppercase;margin-bottom:1rem}
        .hero h1{font-family:var(--font-display);font-size:clamp(2rem,5vw,3.2rem);font-weight:700;color:var(--text-primary);line-height:1.2;margin-bottom:1rem}
        .hero h1 .accent{color:var(--accent)}
        .hero .subtitle{font-size:1.1rem;color:var(--text-secondary);max-width:640px;margin-bottom:2rem}
        .tags{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;margin-bottom:2.5rem}
        .tag{font-family:var(--font-mono);font-size:.75rem;padding:.25rem .75rem;border-radius:999px;border:1px solid var(--accent);color:var(--accent);background:var(--accent-dim);white-space:nowrap}
        .pipeline{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:.25rem;margin-bottom:1rem;max-width:var(--max-width)}
        .pipeline-step{font-family:var(--font-mono);font-size:.7rem;padding:.3rem .7rem;background:var(--bg-card);border:1px solid var(--border);border-radius:4px;color:var(--text-secondary);white-space:nowrap}
        .pipeline-arrow{color:var(--accent);font-size:.9rem;font-weight:700}
        .slide{min-height:100vh;max-width:var(--max-width);margin:0 auto;padding:4rem 1.5rem;position:relative;display:flex;flex-direction:column;justify-content:center}
        .slide-number{font-family:var(--font-display);font-size:5rem;font-weight:700;color:var(--accent-dim);position:absolute;top:2rem;right:1.5rem;line-height:1;user-select:none}
        .slide h2{font-family:var(--font-display);font-size:1.9rem;font-weight:700;color:var(--accent);margin-bottom:1.5rem;line-height:1.25}
        .slide h3{font-family:var(--font-display);font-size:1.3rem;font-weight:600;color:var(--text-primary);margin-top:1.5rem;margin-bottom:.75rem}
        .slide p{margin-bottom:1rem;color:var(--text-secondary)}
        .slide p strong{color:var(--text-primary)}
        .slide ul,.slide ol{margin-bottom:1rem;padding-left:1.5rem;color:var(--text-secondary)}
        .slide li{margin-bottom:.4rem}
        .slide li strong{color:var(--text-primary)}
        .slide code{background:var(--bg-code);padding:.1rem .35rem;border-radius:3px;font-family:var(--font-mono);font-size:.85em;color:var(--accent)}
        .diagram-grid{display:grid;gap:.75rem;margin:1.5rem 0;padding:1.5rem;background:var(--bg-card);border:1px solid var(--border);border-radius:8px}
        .diagram-grid.cols-2{grid-template-columns:1fr 1fr}
        .diagram-grid.cols-3{grid-template-columns:1fr 1fr 1fr}
        .diagram-panel{padding:1rem;background:var(--bg-code);border:1px solid var(--border);border-radius:6px}
        .diagram-panel.accent-border{border-left:3px solid var(--accent)}
        .diagram-panel.r{border-left:3px solid var(--accent-2)}
        .diagram-panel.y{border-left:3px solid var(--accent-3)}
        .diagram-panel.g{border-left:3px solid var(--accent-4)}
        .diagram-panel h4{font-family:var(--font-display);font-size:1rem;color:var(--accent);margin-bottom:.5rem}
        .diagram-panel.r h4{color:var(--accent-2)}
        .diagram-panel.y h4{color:var(--accent-3)}
        .diagram-panel.g h4{color:var(--accent-4)}
        .diagram-panel p,.diagram-panel ul{font-size:.9rem}
        .callout{background:var(--bg-card);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;padding:1rem 1.25rem;margin:1.25rem 0}
        .callout p{margin-bottom:0}
        .callout .callout-label{font-family:var(--font-mono);font-size:.75rem;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:.3rem}
        .canvas-wrap{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:1rem;margin:1.25rem 0;overflow-x:auto}
        .canvas-wrap canvas{display:block;margin:0 auto;max-width:100%;image-rendering:pixelated}
        .control-panel{background:var(--bg-card);border:1px solid var(--border);border-radius:8px;padding:1.25rem;margin:1.25rem 0}
        .control-row{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;margin-bottom:.75rem}
        .control-row label{font-family:var(--font-mono);font-size:.8rem;color:var(--text-secondary);min-width:130px}
        .control-row input[type="range"]{flex:1;min-width:150px;accent-color:var(--accent)}
        .control-row .val{font-family:var(--font-mono);font-size:.85rem;color:var(--accent);min-width:80px;text-align:right}
        .btn{font-family:var(--font-mono);font-size:.8rem;padding:.4rem .9rem;background:var(--accent-dim);color:var(--accent);border:1px solid var(--accent);border-radius:4px;cursor:pointer}
        .btn:hover{background:rgba(168,150,199,.25)}
        .btn.secondary{background:var(--bg-code);color:var(--text-secondary);border-color:var(--border)}
        .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:.5rem;margin-top:.75rem}
        .metric{background:var(--bg-code);border:1px solid var(--border);border-radius:6px;padding:.6rem .8rem;text-align:center}
        .metric .metric-label{font-family:var(--font-mono);font-size:.7rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.08em}
        .metric .metric-value{font-family:var(--font-display);font-size:1.25rem;color:var(--accent);font-weight:600;margin-top:.2rem}
        .contents-list{list-style:none;padding-left:0;counter-reset:contents}
        .contents-list li{counter-increment:contents;padding:.6rem 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem}
        .contents-list li:last-child{border-bottom:none}
        .contents-list li::before{content:counter(contents,decimal-leading-zero);font-family:var(--font-mono);font-size:.85rem;color:var(--accent);min-width:2rem}
        .contents-list a{color:var(--text-primary);text-decoration:none}
        .contents-list a:hover{color:var(--accent)}
        .footer{text-align:center;padding:3rem 1.5rem;color:var(--text-secondary);font-size:.85rem;border-top:1px solid var(--border);max-width:var(--max-width);margin:0 auto}
        .footer a{color:var(--accent);text-decoration:none}
        .katex{color:var(--text-primary)}
        .katex-display{margin:1rem 0;overflow-x:auto;overflow-y:hidden}
        table{width:100%;border-collapse:collapse;font-size:.9rem;margin:1rem 0}
        th{background:var(--bg-code);color:var(--accent);font-weight:600;text-align:left;padding:.6rem .85rem;border-bottom:1px solid var(--border);font-family:var(--font-display)}
        td{padding:.5rem .85rem;border-bottom:1px solid var(--border);color:var(--text-secondary);vertical-align:top}
        tr:last-child td{border-bottom:none}
        tr:nth-child(even) td{background:rgba(23,33,34,.5)}
        @media (max-width:640px){.slide{padding:3rem 1rem;min-height:auto}.slide-number{font-size:3rem;top:1.5rem;right:1rem}.slide h2{font-size:1.5rem}.diagram-grid.cols-2,.diagram-grid.cols-3{grid-template-columns:1fr}.hero h1{font-size:1.8rem}}
    </style>
